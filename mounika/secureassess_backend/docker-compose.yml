version: '3.8'

services:
  web:
    build: .
    container_name: secureassess_api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongo:27017/secureassess
      - JWT_SECRET_KEY=change_this_to_a_secure_random_string_in_production
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: secureassess_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
