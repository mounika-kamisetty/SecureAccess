<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecureAssess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center relative">
    
    <!-- Background Decor -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-cyan-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20"></div>

    <div class="glass-panel w-full max-w-md p-8 relative z-10 animate-fade-in">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-500/20 mb-4">
                <i class="fa-solid fa-shield-halved text-indigo-400 text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
            <p class="text-slate-400 mt-2 text-sm">Sign in to your secure account</p>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center"></div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-slate-500"></i>
                    </div>
                    <input id="email" name="email" type="email" required class="input-field pl-10" placeholder="student@example.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-500"></i>
                    </div>
                    <input id="password" name="password" type="password" required class="input-field pl-10 pr-10" placeholder="••••••••">
                    <button type="button" id="toggle-pwd" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none">
                        <i class="fa-solid fa-eye" id="toggle-icon"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-700 rounded bg-slate-800">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-300">Remember me</label>
                </div>
                <!-- <div class="text-sm">
                    <a href="#" class="font-medium text-indigo-400 hover:text-indigo-300">Forgot password?</a>
                </div> -->
            </div>

            <button type="submit" id="submit-btn" class="w-full btn-primary flex justify-center py-2.5">
                <span id="btn-text">Sign In</span>
                <i id="btn-loader" class="fa-solid fa-circle-notch fa-spin hidden ml-2 mt-1"></i>
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-400">
            Don't have an account? 
            <a href="register.html" class="font-medium text-indigo-400 hover:text-indigo-300">Register here</a>
        </p>
    </div>

    <script type="module">
        import auth from './js/auth.js';
        import guard from './js/guard.js';

        // Redirect if already logged in
        guard.redirectIfAuthenticated();

        // Check if redirected here due to expiry
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('expired')) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = "Your session has expired. Please log in again.";
            errorDiv.classList.remove('hidden');
        }

        // Toggle Password Visibility
        const togglePwd = document.getElementById('toggle-pwd');
        const pwdInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePwd.addEventListener('click', () => {
            const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
            pwdInput.setAttribute('type', type);
            toggleIcon.classList.toggle('fa-eye');
            toggleIcon.classList.toggle('fa-eye-slash');
        });

        // Form Submit
        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading state
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.textContent = "Authenticating...";
            btnLoader.classList.remove('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember-me').checked;

            const result = await auth.login(email, password, remember);

            if (result.success) {
                btnText.textContent = "Success";
                btnLoader.classList.add('hidden');
                
                // Redirect based on role
                guard.redirectBasedOnRole(result.role);
            } else {
                // Reset UI
                submitBtn.disabled = false;
                btnText.textContent = "Sign In";
                btnLoader.classList.add('hidden');
                
                errorDiv.textContent = result.message;
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
