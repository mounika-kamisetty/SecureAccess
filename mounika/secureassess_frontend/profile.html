<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SecureAssess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col">
    
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-indigo-500 text-xl"></i>
                    <span class="font-bold text-lg text-white tracking-tight">SecureAssess</span>
                </div>
                <div class="flex items-center gap-4" id="nav-links">
                    <!-- Dynamically injected -->
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-12 flex-1">
        
        <div class="glass-panel p-8 animate-fade-in relative overflow-hidden">
            <!-- decorative background -->
            <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-r from-indigo-600/40 to-cyan-600/40 z-0"></div>
            
            <div class="relative z-10 flex flex-col sm:flex-row items-center sm:items-end gap-6 mb-8 pt-8 border-b border-slate-700 pb-8">
                <div class="w-24 h-24 rounded-full bg-slate-800 border-4 border-slate-900 flex items-center justify-center text-3xl text-indigo-400 font-bold shadow-xl">
                    <span id="profile-initial">-</span>
                </div>
                <div class="text-center sm:text-left">
                    <h1 class="text-3xl font-bold text-white" id="profile-name">Loading...</h1>
                    <p class="text-slate-400 text-lg" id="profile-email">---</p>
                    <div class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 uppercase" id="profile-role">
                        Role
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
                <!-- Info Section -->
                <div>
                    <h2 class="text-xl font-bold text-white mb-4">Account Information</h2>
                    <div class="space-y-4">
                        <div>
                            <span class="block text-sm text-slate-500">Account ID</span>
                            <span class="text-slate-300 font-mono text-sm" id="profile-id">---</span>
                        </div>
                        <div>
                            <span class="block text-sm text-slate-500">Member Since</span>
                            <span class="text-slate-300" id="profile-created">---</span>
                        </div>
                    </div>
                </div>

                <!-- Password Change Form -->
                <div>
                    <h2 class="text-xl font-bold text-white mb-4">Security</h2>
                    <div id="pwd-msg" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
                    
                    <form id="pwd-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Current Password</label>
                            <input type="password" id="current-pwd" required class="input-field py-1.5" placeholder="••••••••">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">New Password</label>
                            <input type="password" id="new-pwd" required class="input-field py-1.5" placeholder="••••••••">
                        </div>
                        <button type="submit" id="btn-pwd" class="btn-primary w-full py-2 flex justify-center mt-2">
                            <span id="btn-pwd-text">Change Password</span>
                            <i id="btn-pwd-loader" class="fa-solid fa-circle-notch fa-spin hidden ml-2 mt-1"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <div id="toast-container"></div>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
